<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>운동 기록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- 1. 캘린더 화면 (기본 화면) -->
    <div id="calendar-view" class="screen active">
      <header class="app-header">
        <h1>운동 기록</h1>
        <button id="manage-plans-btn" class="header-action-btn" aria-label="플랜 관리">플랜 관리</button>
      </header>
      <div class="calendar-nav">
        <button id="prev-month-btn" class="nav-btn" aria-label="이전 달">&lt;</button>
        <h2 id="calendar-month-year"></h2>
        <button id="next-month-btn" class="nav-btn" aria-label="다음 달">&gt;</button>
      </div>
      <div class="calendar-weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendar-grid" class="calendar-grid">
        <!-- JS가 캘린더 셀을 생성 -->
      </div>
    </div>

    <!-- 8. 플랜 관리 화면 -->
    <div id="plan-manage-view" class="screen">
      <header class="screen-header">
        <button id="plan-manage-back" class="back-btn" aria-label="뒤로가기">&larr;</button>
        <h2>플랜 관리</h2>
      </header>
      <div class="plan-manage-content">
        <div class="plan-section">
          <h3 class="plan-section-title">기본 플랜</h3>
          <div id="default-plans-list" class="plans-list">
            <!-- JS가 기본 플랜 목록 생성 -->
          </div>
        </div>
        <div class="plan-section">
          <h3 class="plan-section-title">커스텀 플랜</h3>
          <div id="custom-plans-list" class="plans-list">
            <!-- JS가 커스텀 플랜 목록 생성 -->
          </div>
          <button id="add-plan-btn" class="add-plan-btn">+ 새 플랜 추가</button>
        </div>
      </div>
    </div>

    <!-- 9. 커스텀 플랜 생성 화면 -->
    <div id="plan-create-view" class="screen">
      <header class="screen-header">
        <button id="plan-create-back" class="back-btn" aria-label="뒤로가기">&larr;</button>
        <h2>새 플랜 만들기</h2>
      </header>
      <div class="plan-create-content">
        <div class="form-group">
          <label for="plan-name-input">플랜 이름</label>
          <input type="text" id="plan-name-input" class="form-input" placeholder="예: C 플랜">
        </div>
        <div class="form-group">
          <label>종목 목록</label>
          <div id="exercise-list-form" class="exercise-list-form">
            <!-- JS가 종목 입력 폼 생성 -->
          </div>
          <button id="add-exercise-btn" class="add-exercise-btn">+ 종목 추가</button>
        </div>
      </div>
      <div class="plan-create-actions">
        <button id="save-plan-btn" class="confirm-btn">플랜 저장</button>
      </div>
    </div>

    <!-- 10. 플랜 삭제 확인 모달 -->
    <div id="delete-plan-modal" class="overlay">
      <div class="modal-content">
        <h3>플랜을 삭제하시겠습니까?</h3>
        <p id="delete-plan-name"></p>
        <div class="modal-actions">
          <button id="delete-plan-cancel" class="cancel-btn">취소</button>
          <button id="delete-plan-confirm" class="confirm-btn danger-btn">삭제</button>
        </div>
      </div>
    </div>

    <!-- 11. 기록 삭제 확인 모달 -->
    <div id="delete-record-modal" class="overlay">
      <div class="modal-content">
        <h3>이 기록을 삭제하시겠습니까?</h3>
        <p>삭제된 기록은 복구할 수 없습니다.</p>
        <div class="modal-actions">
          <button id="delete-record-cancel" class="cancel-btn">취소</button>
          <button id="delete-record-confirm" class="confirm-btn danger-btn">삭제</button>
        </div>
      </div>
    </div>

    <!-- 2. 날짜 상세 화면 -->
    <div id="day-detail-view" class="screen">
      <header class="screen-header">
        <button id="day-detail-back" class="back-btn" aria-label="뒤로가기">&larr;</button>
        <h2 id="day-detail-date"></h2>
      </header>
      <div id="day-detail-content" class="day-detail-content">
        <!-- 기존 기록 표시 영역 -->
      </div>
      <div id="plan-selection" class="plan-selection">
        <!-- JS가 플랜 버튼을 동적 생성 -->
      </div>
    </div>

    <!-- 3. 운동 세션 화면 -->
    <div id="workout-view" class="screen">
      <header class="screen-header">
        <button id="workout-back" class="back-btn" aria-label="운동 종료">&larr;</button>
        <h2 id="workout-plan-name"></h2>
      </header>

      <!-- 종목 진행 표시 -->
      <div id="exercise-progress" class="exercise-progress">
        <!-- 종목별 진행 dot 표시 -->
      </div>

      <!-- 현재 운동 카드 -->
      <div class="workout-card-container">
        <div id="workout-card" class="workout-card">
          <div class="exercise-name" id="current-exercise-name"></div>
          <div class="set-info">
            <span class="set-label">세트</span>
            <span id="current-set-number" class="set-number"></span>
            <span class="set-separator">/</span>
            <span id="total-sets" class="total-sets"></span>
          </div>
          <div class="reps-info">
            <span class="reps-label">목표</span>
            <span id="target-reps" class="reps-number"></span>
            <span class="reps-unit">회</span>
          </div>
        </div>

        <!-- 현재 종목 세트 히스토리 -->
        <div id="set-history" class="set-history">
          <!-- 완료된 세트 기록 표시 -->
        </div>
      </div>

      <!-- 하단 고정 액션 버튼 -->
      <div class="workout-actions">
        <button id="fail-btn" class="action-btn fail-btn">실패</button>
        <button id="success-btn" class="action-btn success-btn">성공</button>
      </div>
    </div>

    <!-- 4. 휴식 타이머 오버레이 -->
    <div id="timer-overlay" class="overlay">
      <div class="timer-content">
        <div class="timer-label">휴식 시간</div>
        <div id="timer-display" class="timer-display">90</div>
        <div class="timer-unit">초</div>
        <button id="skip-timer-btn" class="skip-timer-btn">건너뛰기</button>
      </div>
    </div>

    <!-- 5. 실패 입력 모달 -->
    <div id="fail-modal" class="overlay">
      <div class="modal-content">
        <h3>몇 회 수행했나요?</h3>
        <div class="fail-input-container">
          <button id="fail-reps-minus" class="reps-adjust-btn">−</button>
          <input type="number" id="fail-reps-input" class="fail-reps-input" min="0" value="0" inputmode="numeric">
          <button id="fail-reps-plus" class="reps-adjust-btn">+</button>
        </div>
        <span class="fail-reps-unit">회</span>
        <button id="fail-confirm-btn" class="confirm-btn">확인</button>
      </div>
    </div>

    <!-- 6. 운동 완료 모달 -->
    <div id="complete-modal" class="overlay">
      <div class="modal-content complete-content">
        <div class="complete-icon">💪</div>
        <h3>운동 완료!</h3>
        <div id="complete-summary" class="complete-summary">
          <!-- 운동 요약 -->
        </div>
        <button id="complete-confirm-btn" class="confirm-btn">확인</button>
      </div>
    </div>

    <!-- 7. 기록 덮어쓰기 확인 모달 -->
    <div id="overwrite-modal" class="overlay">
      <div class="modal-content">
        <h3>이미 기록이 있습니다</h3>
        <p>기존 기록을 덮어쓰시겠습니까?</p>
        <div class="modal-actions">
          <button id="overwrite-cancel" class="cancel-btn">취소</button>
          <button id="overwrite-confirm" class="confirm-btn">확인</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
